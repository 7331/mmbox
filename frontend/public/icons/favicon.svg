<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- mmbox's mark (owner asked for a new logo, 2026-10-12): an "m" and the middle dot of pay·7331's mark, drawn in
       strokes so no font is needed, on pay's neutral palette (#171717, #fafafa, #a1a1a1). Full bleed, no transparency:
       iOS rounds the corners itself. The mark stays inside the central circle of radius 40% a maskable icon keeps
       (https://www.w3.org/TR/appmanifest/#icon-masks), so the same drawing is the maskable icon. The PNGs beside it
       are rendered from this file with librsvg, from this folder:
         rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png
         rsvg-convert -w 192 -h 192 favicon.svg -o icon-192.png
         rsvg-convert -w 512 -h 512 favicon.svg -o icon-512.png
         rsvg-convert -w 512 -h 512 favicon.svg -o icon-maskable-512.png -->
  <rect width="512" height="512" fill="#171717"/>
  <g transform="translate(-30 -24)">
    <path d="M150 360V250a50 50 0 0 1 100 0V360M250 250a50 50 0 0 1 100 0V360" fill="none" stroke="#fafafa" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="425" cy="292" r="24" fill="#a1a1a1"/>
  </g>
</svg>
