services:
  redis:
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # No persistence: the data IS the TTL. allkeys-lru bounds memory; worst case is an early
    # eviction, which is semantically fine for an ephemeral host.
    command: ["redis-server", "--save", "", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Above maxmemory: Redis's own overhead and buffers live outside it.
    mem_limit: 640m
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mmbox-app:${MMBOX_TAG:-latest}
    environment:
      REDIS_URL: redis://redis:6379/0
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8099}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Uvicorn plus the 2-worker Pillow process pool.
    mem_limit: 768m
    # Longer than uvicorn's 20 s graceful-shutdown drain, so in-flight requests finish before SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
