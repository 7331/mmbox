name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        working-directory: backend
        run: uv sync --locked

      - name: Format
        working-directory: backend
        run: uv run ruff format --check .

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Types
        working-directory: backend
        run: uv run ty check

      - name: Import layers
        working-directory: backend
        run: uv run lint-imports

      - name: Dependencies
        working-directory: backend
        run: uv run deptry .

      - name: Dead code
        working-directory: backend
        run: uv run vulture

      - name: Spelling
        run: uv run --directory backend codespell

      - name: Dependency audit
        working-directory: backend
        run: uv run pip-audit

      - name: Tests
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm at package.json's packageManager version, Node 24, the pnpm store cached (https://pnpm.io/continuous-integration).
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          working-directory: frontend
          install: false
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm build
